<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Badge background: teal, stands out on dark navy navbar -->
  <rect x="10" y="10" width="160" height="160" rx="34" fill="#0D9488"/>

  <!-- Gear teeth -->
  <g>
    <rect x="80" y="18" width="20" height="26" rx="3" fill="#FFFFFF" transform="rotate(0 90 90)"/>
    <rect x="80" y="18" width="20" height="26" rx="3" fill="#FFFFFF" transform="rotate(45 90 90)"/>
    <rect x="80" y="18" width="20" height="26" rx="3" fill="#FFFFFF" transform="rotate(90 90 90)"/>
    <rect x="80" y="18" width="20" height="26" rx="3" fill="#FFFFFF" transform="rotate(135 90 90)"/>
    <rect x="80" y="18" width="20" height="26" rx="3" fill="#FFFFFF" transform="rotate(180 90 90)"/>
    <rect x="80" y="18" width="20" height="26" rx="3" fill="#FFFFFF" transform="rotate(225 90 90)"/>
    <rect x="80" y="18" width="20" height="26" rx="3" fill="#FFFFFF" transform="rotate(270 90 90)"/>
    <rect x="80" y="18" width="20" height="26" rx="3" fill="#FFFFFF" transform="rotate(315 90 90)"/>
  </g>
  <!-- Gear body -->
  <circle cx="90" cy="90" r="46" fill="#FFFFFF"/>
  <!-- Gear hole (punches through to badge color) -->
  <circle cx="90" cy="90" r="30" fill="#0D9488"/>

  <!-- White checkmark, centered in the gear hole -->
  <path d="M75 91 L86 102 L107 78" stroke="#FFFFFF" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
